<!doctype html>
<!-- Integration harness for X's current XChat DOM: avatar-only profile link,
     sibling display name, and a controlled-style textarea composer. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XChat insertion harness</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../src/content.css" />
    <style>
      body { margin: 0; background: #000; color: #e7e9ea; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
      main { width: min(680px, calc(100% - 32px)); margin: 32px auto; border: 1px solid #2f3336; border-radius: 16px; overflow: hidden; }
      [data-testid="dm-conversation"] { min-height: 520px; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2f3336; }
      header img { width: 36px; height: 36px; border-radius: 50%; background: #1d9bf0; }
      .title { font-weight: 700; }
      .messages { flex: 1; display: flex; align-items: flex-end; padding: 16px; color: #71767b; }
      .composer { display: flex; align-items: flex-end; gap: 10px; padding: 12px; border-top: 1px solid #2f3336; }
      textarea { flex: 1; min-height: 44px; max-height: 150px; resize: vertical; border: 1px solid #2f3336; border-radius: 18px; padding: 10px 14px; background: #16181c; color: #e7e9ea; font: inherit; }
      button { border: 0; border-radius: 999px; padding: 10px 18px; background: #1d9bf0; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <section data-testid="dm-conversation">
        <header data-testid="dm-conversation-header">
          <a href="/builderswhoride" aria-label="Open Builders Who Ride profile">
            <img alt="user avatar" />
          </a>
          <div class="title" data-testid="dm-conversation-title">Builders Who Ride</div>
        </header>
        <div class="messages">Dedicated test conversation</div>
        <div class="composer" data-testid="xchat-composer">
          <textarea aria-label="Unencrypted message" placeholder="Unencrypted message"></textarea>
          <button type="button">Send</button>
        </div>
      </section>
    </main>

    <script>
      window.__harnessStore = {
        enabled: {},
        dmTemplates: {
          version: 1,
          templates: [
            {
              id: "t1", name: "Latest + company",
              body: "hey {{first_name}}, what is the latest with {{company}}? are you a solo founder?",
              shortcut: { code: "Digit1", alt: true, ctrl: false, meta: false, shift: false },
            },
            {
              id: "t2", name: "What are you working on",
              body: "hey {{first_name}}, what are you working on these days? are you a solo founder?",
              shortcut: { code: "Digit2", alt: true, ctrl: false, meta: false, shift: false },
            },
          ],
        },
      };
      window.chrome = {
        storage: {
          sync: { get: async (key) => ({ [key]: window.__harnessStore[key] }) },
          onChanged: { addListener() {} },
        },
      };
      window.__inputEvents = [];
      document.querySelector("textarea").addEventListener("input", (event) => {
        window.__inputEvents.push({ value: event.currentTarget.value, inputType: event.inputType });
      });
    </script>
    <script src="../src/template-lib.js"></script>
    <script src="../src/dm-templates.js"></script>
    <script src="../src/content.js"></script>
    <script>history.replaceState({}, "", "/i/chat/111-222");</script>
  </body>
</html>
